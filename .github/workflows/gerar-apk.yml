name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extrair projeto Android
        run: |
          unzip -o ControlePressaoAndroid.zip -d .

      - name: Compilar APK
        run: |
          gradle -p ControlePressaoAndroid assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControlePressaoAndroid-APK
          path: ControlePressaoAndroid/app/build/outputs/apk/debug/*.apk 
